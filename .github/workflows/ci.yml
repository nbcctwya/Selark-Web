name: Desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Selark backend commit or branch containing desktop-session
        required: false
        default: a985b3e4739583af69a20377abfe82e5910e4d10

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      # This job needs browser assets only; native desktop setup runs on Windows.
      - run: npm ci --ignore-scripts
      - run: npm run setup:api
      - run: npm run check:api
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Preserve browser diagnostics (synthetic fixtures only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selark-web-browser
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    runs-on: windows-latest
    env:
      # Fixed versions still use the checksums shipped in the locked installers.
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: desktop
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nbcctwya/Selark
          ref: ${{ inputs.backend_ref || 'a985b3e4739583af69a20377abfe82e5910e4d10' }}
          path: backend
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install native backend build dependencies
        run: |
          python -m pip install -r ../backend/requirements-build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps -e ../backend
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:native
      - run: npm run test:desktop
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:package
      - run: node scripts/verify-package.mjs
      - run: npm run test:windows
      - run: npm run test:windows:desktop
        env:
          SELARK_TEST_PACKAGED: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selark-windows-x64
          path: desktop/release/Selark-Setup-*.exe
          retention-days: 14
